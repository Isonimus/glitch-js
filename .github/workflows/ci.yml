name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify TypeScript Compilation & Playground Build
        run: npm run build

      - name: Verify Library Distribution Build
        run: npm run build:lib

      - name: Run Unit Tests
        run: npm run test

      # Runs last on purpose. A fresh advisory against a dependency is not a
      # defect in the commit under test, so it must not pre-empt the signal
      # from the build and the tests: those report first, then this fails the
      # run. The threshold lives in the `audit` script so a contributor's local
      # gate is the same gate.
      - name: Audit Dependencies
        run: npm run audit
